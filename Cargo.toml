[workspace]
resolver = "3"

[workspace.dependencies]
base64     = "0.23"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

must_use_candidate = "allow"

[package]
authors     = ["Vladas Zakrevskis <146100@gmail.com>"]
description = "The diff of one file as plain data, and the patches that discard a part of it"
edition     = "2024"
license     = "MIT"
name        = "filediff"
repository  = "https://github.com/hilen/filediff"
version     = "0.1.0"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
serde  = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[profile.dev.package."*"]
opt-level = 3

[profile.deploy]
codegen-units = 1
inherits      = "release"
lto           = "fat"
opt-level     = 3
strip         = true

[profile.deploy-wasm]
inherits = "deploy"
strip    = false
